[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsearch"
version = "0.1.0"
description = "Unified internet/network search: own scanner + third-party sources + AI insights, with a local database, web UI and CLI."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "cryptography>=42",
  "anthropic>=0.100",
  "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netsearch = "netsearch.cli:main"

[tool.setuptools]
packages = ["netsearch"]

[tool.setuptools.package-data]
netsearch = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
